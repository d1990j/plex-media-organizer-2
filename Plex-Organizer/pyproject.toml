[project]
name = "plex-organizer"
version = "0.1.0"
description = "Easily organize media files for export to a Plex Media Server."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Dewain Jones", email = "dev@dewainjones.com" }
]
dependencies = [
    "flet>=0.86.0"
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.0",
    "flet-desktop>=0.86.0",
    "flet-web>=0.86.0",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "com.dewainjones"
product = "plex-organizer"
company = "Dewain Jones"
copyright = "Copyright (C) 2026 by Dewain Jones"

[tool.flet.app]
path = "src"
